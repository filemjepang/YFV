<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YourFavVideo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       THEME VARIABLES
       ============================================ */
    :root {
      --bg: #121214;
      --surface: #1a1b1e;
      --text: #ece7de;
      --muted: #8a877f;
      --accent: #d4a656;
      --border: rgba(255, 255, 255, 0.09);
      --grid: rgba(255, 255, 255, 0.05);
      --radius: 0;
      --error: #c0392b;
    }

    /* ============================================
       RESET & BASE
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 20px calc(88px + env(safe-area-inset-bottom, 0px));
      padding-top: calc(40px + env(safe-area-inset-top, 0px));
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 44px),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
      background-size: 44px 44px, 44px 44px, 140px 140px;
      mix-blend-mode: overlay;
    }

    /* ============================================
       LAYOUT
       ============================================ */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
    }

    /* ============================================
       FORM
       ============================================ */
    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="text"].invalid {
      border-color: var(--error);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .field-error {
      display: none;
      color: var(--error);
      font-size: 12px;
      margin-top: 7px;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .field-error.show {
      display: block;
    }

    button.submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--surface);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: opacity 0.2s ease;
    }

    button.submit:hover { opacity: 0.9; }
    button.submit:active { opacity: 0.8; }

    /* ============================================
       VIDEO PLAYER
       ============================================ */
    #result { display: none; }

    .frame {
      position: relative;
      padding: 12px;
      margin: 0 auto;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--accent);
      z-index: 2;
      pointer-events: none;
    }

    .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

    .player {
      width: 100%;
      background: #000;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      max-width: 100%;
    }

    .player > video,
    .player > iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      border: 0;
      display: block;
      background: #000;
    }

    #playerError {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    #playerError.show { display: block; }

    /* ============================================
       TOAST
       ============================================ */
    #toast {
      position: fixed;
      left: 50%;
      top: calc(24px + env(safe-area-inset-top, 0px));
      transform: translate(-50%, -20px);
      background: var(--text);
      color: var(--bg);
      padding: 11px 18px;
      border-radius: var(--radius);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ============================================
       FOOTER
       ============================================ */
    #siteFooter {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    #siteFooter a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    #siteFooter a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* ============================================
       VIEWER MODE
       ============================================ */
    body.viewer-mode {
      padding: 20px;
      padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      align-items: center;
    }

    body.viewer-mode .wrap {
      max-width: min(960px, 92vw);
    }

    body.viewer-mode #form { display: none; }

    body.viewer-mode #result {
      background: transparent;
    }

    body.viewer-mode .card {
      background: transparent;
      border: 0;
      padding: 0;
    }

    body.viewer-mode #linkError {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Form Input -->
    <form class="card" id="form" novalidate>
      <div class="field">
        <label for="src">url embed / video</label>
        <input
          type="text"
          id="src"
          placeholder="https://example.com/video.mp4"
          required
          autocomplete="off"
          spellcheck="false"
          aria-label="URL video atau embed"
        >
        <p class="field-error" id="srcError" role="alert">URL harus diawali dengan http:// atau https://</p>
      </div>
      <button type="submit" class="submit">Buat link</button>
    </form>

    <!-- Result Card (Video Preview) -->
    <div id="result" class="card">
      <div id="previewSection">
        <div class="frame" id="frameBox">
          <span class="corner tl" aria-hidden="true"></span>
          <span class="corner tr" aria-hidden="true"></span>
          <span class="corner bl" aria-hidden="true"></span>
          <span class="corner br" aria-hidden="true"></span>
          <div class="player" id="player" role="region" aria-label="Video player"></div>
        </div>
        <p class="field-error" id="playerError" role="alert">Video/embed gagal dimuat. Cek lagi URL-nya.</p>
      </div>
    </div>

    <!-- Error Card (Invalid Link) -->
    <div id="linkError" class="card" style="display:none;" role="alert">
      Link ini tidak valid atau rusak, jadi ga bisa ditampilkan.
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite">Link disalin</div>

  <!-- Footer -->
  <footer id="siteFooter">
    <a href="https://filemjepang.github.io/YFV/" id="footerHome">YourFavVideo</a> &copy; 2026
  </footer>

  <script>
    /* ============================================
       DOM REFERENCES
       ============================================ */
    const elements = {
      form: document.getElementById('form'),
      srcInput: document.getElementById('src'),
      result: document.getElementById('result'),
      player: document.getElementById('player'),
      frameBox: document.getElementById('frameBox'),
      toast: document.getElementById('toast'),
      srcError: document.getElementById('srcError'),
      linkError: document.getElementById('linkError'),
      previewSection: document.getElementById('previewSection'),
      playerError: document.getElementById('playerError'),
    };

    /* ============================================
       ENCRYPTION (XOR + Base64 URL-safe)
       ============================================ */
    const XOR_KEY = 'yfv-2026-frame-key';

    function xorBytes(bytes) {
      const key = new TextEncoder().encode(XOR_KEY);
      const out = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) {
        out[i] = bytes[i] ^ key[i % key.length];
      }
      return out;
    }

    function encodeToken(obj) {
      const bytes = xorBytes(new TextEncoder().encode(JSON.stringify(obj)));
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    function decodeToken(token) {
      try {
        let b64 = token.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          bytes[i] = bin.charCodeAt(i);
        }
        const json = new TextDecoder().decode(xorBytes(bytes));
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    }

    /* ============================================
       URL UTILS
       ============================================ */
    function extractSrc(raw) {
      raw = raw.trim();
      const embedMatch = raw.match(/src=["']([^"']+)["']/i);
      return embedMatch ? embedMatch[1] : raw;
    }

    function isSafeEmbedUrl(url) {
      if (typeof url !== 'string' || !url.trim()) return false;
      try {
        const u = new URL(url, location.href);
        return u.protocol === 'https:' || u.protocol === 'http:';
      } catch (e) {
        return false;
      }
    }

    const VIDEO_EXTENSIONS = /\.(mp4|webm|ogg|ogv|mov|m4v)(\?.*)?(#.*)?$/i;

    function isDirectVideo(url) {
      try {
        const u = new URL(url, location.href);
        return VIDEO_EXTENSIONS.test(u.pathname);
      } catch (e) {
        return false;
      }
    }

    /* ============================================
       UI HELPERS
       ============================================ */
    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add('show');

      if (showToast._timeout) {
        clearTimeout(showToast._timeout);
      }

      showToast._timeout = setTimeout(() => {
        elements.toast.classList.remove('show');
      }, 2500);
    }

    function clearFormError() {
      elements.srcInput.classList.remove('invalid');
      elements.srcError.classList.remove('show');
    }

    function showFormError() {
      elements.srcInput.classList.add('invalid');
      elements.srcError.classList.add('show');
    }

    function showPlayerError() {
      elements.frameBox.style.display = 'none';
      elements.playerError.classList.add('show');
    }

    function hidePlayerError() {
      elements.playerError.classList.remove('show');
      elements.frameBox.style.display = '';
    }

    /* ============================================
       VIDEO PLAYER
       ============================================ */
    function updatePlayerAspectRatio(videoEl) {
      if (videoEl.videoWidth && videoEl.videoHeight) {
        const ratio = videoEl.videoWidth / videoEl.videoHeight;
        elements.player.style.aspectRatio = `${ratio} / 1`;
      }
    }

    function renderVideo(src) {
      elements.player.innerHTML = '';
      hidePlayerError();
      elements.player.style.aspectRatio = '16 / 9';

      if (isDirectVideo(src)) {
        const video = document.createElement('video');
        video.controls = true;
        video.playsInline = true;
        video.disablePictureInPicture = true;
        video.setAttribute('controlsList', 'nodownload noremoteplayback');
        video.addEventListener('contextmenu', e => e.preventDefault());
        video.addEventListener('error', showPlayerError);
        video.addEventListener('loadedmetadata', () => updatePlayerAspectRatio(video));
        video.src = src;
        elements.player.appendChild(video);
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.addEventListener('error', showPlayerError);
        elements.player.appendChild(iframe);
      }

      elements.previewSection.style.display = '';
      elements.result.style.display = 'block';
    }

    /* ============================================
       CLIPBOARD
       ============================================ */
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }

      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();

        try {
          const success = document.execCommand('copy');
          if (success) resolve();
          else reject(new Error('Copy command failed'));
        } catch (e) {
          reject(e);
        } finally {
          document.body.removeChild(textarea);
        }
      });
    }

    /* ============================================
       FULLSCREEN / ORIENTATION
       ============================================ */
    function isLandscapeMedia(el) {
      if (el.videoWidth && el.videoHeight) {
        return el.videoWidth >= el.videoHeight;
      }
      return true;
    }

    document.addEventListener('fullscreenchange', () => {
      const fsEl = document.fullscreenElement;

      if (fsEl && fsEl.tagName === 'VIDEO' && isLandscapeMedia(fsEl)) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } else if (!fsEl && screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }
    });

    /* ============================================
       EVENT LISTENERS
       ============================================ */
    elements.srcInput.addEventListener('input', clearFormError);

    elements.form.addEventListener('submit', (e) => {
      e.preventDefault();

      const src = extractSrc(elements.srcInput.value);

      if (!isSafeEmbedUrl(src)) {
        showFormError();
        elements.srcInput.focus();
        return;
      }

      clearFormError();

      const token = encodeToken({ src });
      const shareLink = `${location.origin}${location.pathname}?d=${token}`;

      copyToClipboard(shareLink)
        .then(() => showToast('Link berhasil disalin'))
        .catch(() => showToast('Gagal menyalin link'));
    });

    /* ============================================
       INIT (Viewer Mode)
       ============================================ */
    (function init() {
      const params = new URLSearchParams(location.search);
      const token = params.get('d');

      if (!token) return;

      const data = decodeToken(token);
      const src = data && data.src;

      if (!data || !isSafeEmbedUrl(src)) {
        document.body.classList.add('viewer-mode');
        elements.result.style.display = 'none';
        elements.linkError.style.display = 'block';
        return;
      }

      elements.srcInput.value = src;
      renderVideo(src);
      document.body.classList.add('viewer-mode');
    })();
  </script>
</body>
</html>
